<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ChanchitOS</title>
    <script>
      // Mismo tema que Vestigia, aplicado antes de pintar.
      try {
        var t = JSON.parse(localStorage.getItem('vestigia.theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="ChanchitOS: el sueldo del mes, a dónde fue y lo que queda." />
    <meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChanchitOS" />
    <link rel="icon" type="image/svg+xml" href="../icon.svg" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chanchitos/main.jsx"></script>
  </body>
</html>
